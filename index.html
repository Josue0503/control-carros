<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Carros - Importación</title>
<style>
  :root{
    --bg: #121316;
    --surface: #1B1D22;
    --surface-2: #24272E;
    --surface-hover: #2B2F38;
    --border: #2E323B;
    --border-strong: #3F4452;
    --text: #F3F4F6;
    --text-secondary: #9CA3AF;
    --text-muted: #6B7280;
    
    --accent: #EAB308;
    --accent-hover: #CA8A04;
    --accent-bg: rgba(234, 179, 8, 0.12);
    --accent-text: #FACC15;

    --success: #22C55E;
    --success-bg: rgba(34, 197, 94, 0.12);
    --success-text: #4ADE80;

    --warning: #F97316;
    --warning-bg: rgba(249, 115, 22, 0.12);
    --warning-text: #FB923C;

    --danger: #EF4444;
    --danger-bg: rgba(239, 68, 68, 0.12);
    --danger-text: #F87171;

    --radius: 12px;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    line-height:1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap{max-width:960px;margin:0 auto;padding:40px 20px 80px;}

  .masthead{
    display:flex;justify-content:space-between;align-items:flex-end;
    margin-bottom:28px;flex-wrap:wrap;gap:16px;
  }
  .masthead h1{
    font-size:28px;
    font-weight:700;
    margin:0 0 4px;
    letter-spacing:-0.02em;
    color: var(--text);
  }
  .masthead p{margin:0;color:var(--text-secondary);font-size:14px;}
  .masthead-btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}

  /* Botones */
  .btn{
    font-family: var(--font-sans);
    font-size:14px;
    font-weight:600;
    padding:10px 18px;
    border-radius:var(--radius);
    border:1px solid var(--accent);
    background:var(--accent);
    color:#121316;
    cursor:pointer;
    transition: all 0.2s ease;
  }
  .btn:hover{
    background:var(--accent-hover);
    border-color:var(--accent-hover);
    transform: translateY(-1px);
  }
  .btn.secondary{
    background:var(--surface-2);
    color:var(--text);
    border:1px solid var(--border-strong);
  }
  .btn.secondary:hover{
    background:var(--surface-hover);
    border-color:var(--text-secondary);
  }
  .btn.small{padding:7px 14px;font-size:13px;border-radius:8px;}
  .btn.danger-ghost{
    background:transparent;
    border:1px solid var(--border-strong);
    color:var(--danger);
    font-weight:500;
  }
  .btn.danger-ghost:hover{
    background: var(--danger-bg);
    border-color: var(--danger);
  }

  .status{font-size:13px;font-weight:500;color:var(--text-muted);margin-top:6px;width:100%;}
  .status.error{color:var(--danger);}
  .status.success{color:var(--success-text);}

  /* Métricas */
  .metrics{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:14px;
    margin-bottom:28px;
  }
  .metric{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px 20px;
  }
  .metric .label{
    font-size:12px;
    font-weight:600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color:var(--text-muted);
    margin-bottom:8px;
  }
  .metric .value{
    font-size:24px;
    font-weight:700;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  .metric .value.pos{color:var(--success-text);}
  .metric .value.neg{color:var(--danger-text);}

  /* Barra de Filtros y Búsqueda */
  .controls-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:20px;
    flex-wrap:wrap;
  }
  .filter-tabs{
    display:flex;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:4px;
    gap:4px;
  }
  .tab-btn{
    background:transparent;
    border:none;
    color:var(--text-secondary);
    padding:6px 14px;
    font-size:13px;
    font-weight:600;
    border-radius:6px;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .tab-btn.active{
    background:var(--surface-2);
    color:var(--accent-text);
  }
  .search-box{
    display:flex;
    gap:8px;
    flex:1;
    max-width:320px;
  }
  .search-box input{
    width:100%;
    padding:8px 12px;
    font-size:13px;
  }

  /* Tarjeta Carro */
  .car{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    margin-bottom:14px;
    overflow:hidden;
  }
  
  .car-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:18px 20px;cursor:pointer;gap:12px;flex-wrap:wrap;
    background: var(--surface);
    transition: background 0.2s ease;
  }
  .car-head:hover{background:var(--surface-2);}
  .car-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .car-title .name{font-weight:600;font-size:16px;color:var(--text);}
  .arrow-icon{
    font-size:12px;
    color:var(--text-muted);
    transition:transform 0.2s ease;
  }
  .car-head.is-open .arrow-icon{ transform: rotate(180deg); }
  
  /* Badges de Estado */
  .badge{
    font-size:11px;
    font-weight:700;
    padding:4px 10px;
    border-radius:20px;
    text-transform: uppercase;
  }
  .badge.transit{background:rgba(59, 130, 246, 0.15);color:#60A5FA;border:1px solid rgba(59, 130, 246, 0.3);}
  .badge.repair{background:var(--accent-bg);color:var(--accent-text);border:1px solid rgba(234,179,8,0.3);}
  .badge.pnc{background:rgba(236, 72, 153, 0.15);color:#F472B6;border:1px solid rgba(236, 72, 153, 0.3);}
  .badge.paperwork{background:var(--warning-bg);color:var(--warning-text);border:1px solid rgba(249, 115, 22, 0.3);}
  .badge.ready{background:rgba(168, 85, 247, 0.15);color:#C084FC;border:1px solid rgba(168, 85, 247, 0.3);}
  .badge.sold{background:var(--success-bg);color:var(--success-text);border:1px solid rgba(34,197,94,0.3);}
  
  .days-tag{
    font-size:12px;
    font-weight:600;
    padding:2px 8px;
    border-radius:6px;
    background:var(--surface-2);
    color:var(--text-secondary);
  }

  .car-nums{text-align:right;font-size:13.5px;color:var(--text-secondary);}
  .car-nums .profit{font-size:14.5px;font-weight:700;color:var(--text);margin-top:2px;}
  .car-nums .profit.pos{color:var(--success-text);}
  .car-nums .profit.neg{color:var(--danger-text);}

  .car-body{
    border-top:1px solid var(--border);
    padding:20px;
    background:var(--surface-2);
    display:none;
  }
  .car-body.open{display:block;}

  .row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:14px;border-bottom:1px dashed var(--border);}
  .row .l{color:var(--text-secondary);}
  .row .r{font-weight:600;color:var(--text);}

  .stage-selector{
    display:flex;
    gap:8px;
    margin: 14px 0;
    align-items:center;
    flex-wrap:wrap;
    background:var(--surface);
    padding:10px;
    border-radius:8px;
  }
  .stage-selector label{font-size:13px;font-weight:600;color:var(--text-secondary);}

  /* Lista de gastos */
  .expenses-list{margin:14px 0;}
  .expense-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 14px;background:var(--surface);border:1px solid var(--border);
    border-radius:8px;margin-bottom:8px;font-size:13.5px;
  }
  .expense-row .amt{font-weight:600;color:var(--accent-text);}
  .expense-row button{
    background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:18px;
  }
  .expense-row button:hover{color:var(--danger);}

  .multi-expenses-container{
    background: var(--surface);
    border: 1px solid var(--border-strong);
    padding: 14px;
    border-radius: 10px;
    margin-top: 14px;
  }
  .expense-input-row{display:flex;gap:10px;margin-bottom:8px;flex-wrap:wrap;align-items:center;}
  .expense-input-row input[type=text]{flex:2;min-width:140px;}
  .expense-input-row input[type=number]{flex:1;min-width:90px;}

  input, select{
    font-family:var(--font-sans);
    font-size:14px;
    padding:8px 12px;
    border-radius:8px;
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--text);
  }

  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--surface);border:1px solid var(--border-strong);
    border-radius:16px;padding:28px;width:100%;max-width:420px;
  }
  .modal h2{font-size:20px;font-weight:700;margin:0 0 20px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:500;color:var(--text-secondary);margin-bottom:6px;}
  .field input{width:100%;}
  .empty{text-align:center;padding:40px;color:var(--text-muted);background:var(--surface);border-radius:12px;}

  .loading-overlay{
    display:none;position:fixed;inset:0;background:rgba(18,19,22,0.8);
    backdrop-filter: blur(2px);
    align-items:center;justify-content:center;z-index:100;
  }
  .loading-overlay.show{display:flex;}
  .spinner{
    width:42px;height:42px;border:3px solid var(--border-strong);border-top-color:var(--accent);
    border-radius:50%;animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div>
      <h1>Control de carros</h1>
      <p>Importación, Reparación y Venta</p>
    </div>
    <div class="masthead-btns">
      <button class="btn" id="btn-add-car">+ Agregar carro</button>
      <button class="btn secondary" id="btn-sync">↻ Sincronizar</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="metrics" id="metrics"></div>

  <!-- Barra de Filtros por Estado y Búsqueda -->
  <div class="controls-bar">
    <div class="filter-tabs">
      <button class="tab-btn active" data-filter="all">Todos</button>
      <button class="tab-btn" data-filter="active">En reparación</button>
      <button class="tab-btn" data-filter="sold">Vendidos</button>
    </div>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="🔍 Buscar por nombre/placa...">
    </div>
  </div>

  <div id="car-list"></div>

</div>

<!-- Modal Nuevo Carro -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2>Nuevo vehículo</h2>
    <div class="field">
      <label>Vehículo (Ej: Outlander Sport 2019)</label>
      <input type="text" id="new-name" placeholder="Marca Modelo Año">
    </div>
    <div class="field">
      <label>Precio de Compra (USD)</label>
      <input type="number" id="new-price" placeholder="0.00" step="0.01">
    </div>
    <div class="field">
      <label>Fecha de Compra</label>
      <input type="date" id="new-date">
    </div>
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px;">
      <button class="btn secondary" id="btn-cancel">Cancelar</button>
      <button class="btn" id="btn-save-car">Guardar</button>
    </div>
  </div>
</div>

<div class="loading-overlay" id="loading-overlay">
  <div class="spinner"></div>
</div>

<script>
const GOOGLE_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw1b7dGmQh2DO0rs8pBH30xZbktf9MzqkvhSWHCuJo65x7FOOE63eFqY0YoeT2S7gLW4A/exec';

let cars = [];
let openCarId = null;
let currentFilter = 'all';
let searchQuery = '';

function showStatus(msg, type = 'info'){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + type;
}

function showLoading(show = true){
  document.getElementById('loading-overlay').classList.toggle('show', show);
}

function fmt(n){ return '$' + (Number(n)||0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }

function calcDays(startDateStr){
  if(!startDateStr) return 0;
  const start = new Date(startDateStr);
  const now = new Date();
  return Math.ceil(Math.abs(now - start) / (1000 * 60 * 60 * 24)); 
}

async function callGoogleAppsScript(action, data){
  showLoading(true);
  try{
    const response = await fetch(GOOGLE_APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({action, data})
    });
    const result = await response.json();
    showLoading(false);
    if(result.success){
      showStatus('Sincronizado con éxito', 'success');
      return result;
    }else{
      showStatus('Error: ' + result.error, 'error');
      return null;
    }
  }catch(e){
    showLoading(false);
    showStatus('Error de conexión', 'error');
    console.error(e);
    return null;
  }
}

async function loadFromSheet(){
  const result = await callGoogleAppsScript('getCars', {});
  if(result && result.cars){
    cars = result.cars;
    render();
  }
}

async function saveCar(car){
  render();
  await callGoogleAppsScript('saveCar', {car});
}

function carExpensesTotal(car){
  return (car.expenses||[]).reduce((s,e)=>s+Number(e.amount||0),0);
}

function carInvested(car){
  return Number(car.purchasePrice||0) + carExpensesTotal(car);
}

function carProfit(car){
  if(!car.sold) return null;
  return Number(car.salePrice||0) - carInvested(car);
}

function renderMetrics(){
  const activos = cars.filter(c=>!c.sold);
  const vendidos = cars.filter(c=>c.sold);
  
  const totalInvertidoActivo = activos.reduce((s,c)=>s+carInvested(c),0);
  const gananciaTotal = vendidos.reduce((s,c)=>s+carProfit(c),0);

  const el = document.getElementById('metrics');
  el.innerHTML = `
    <div class="metric">
      <div class="label">Invertido (En Proceso)</div>
      <div class="value">${fmt(totalInvertidoActivo)}</div>
    </div>
    <div class="metric">
      <div class="label">Carros activos</div>
      <div class="value">${activos.length}</div>
    </div>
    <div class="metric">
      <div class="label">Carros vendidos</div>
      <div class="value">${vendidos.length}</div>
    </div>
    <div class="metric">
      <div class="label">Ganancia total</div>
      <div class="value ${gananciaTotal>=0?'pos':'neg'}">${fmt(gananciaTotal)}</div>
    </div>
  `;
}

function render(){
  renderMetrics();
  const list = document.getElementById('car-list');

  let filtered = cars.filter(c => {
    const matchesFilter = (currentFilter === 'all') || 
                          (currentFilter === 'active' && !c.sold) || 
                          (currentFilter === 'sold' && c.sold);
    const matchesSearch = c.name.toLowerCase().includes(searchQuery.toLowerCase());
    return matchesFilter && matchesSearch;
  });

  if(filtered.length === 0){
    list.innerHTML = `<div class="empty">No se encontraron vehículos.</div>`;
    return;
  }

  list.innerHTML = filtered.map(car => {
    const days = calcDays(car.purchaseDate);
    const invested = carInvested(car);
    const profit = carProfit(car);
    const isOpen = openCarId === car.id;
    const stage = car.stage || (car.sold ? 'sold' : 'repair');

    const stageMap = {
      'transit': {label: '🚢 En Tránsito', cls: 'transit'},
      'repair': {label: '🛠️ En Taller', cls: 'repair'},
      'pnc': {label: '📋 Experticia PNC', cls: 'pnc'},
      'paperwork': {label: '📄 En Placas', cls: 'paperwork'},
      'ready': {label: '✨ Listo para Venta', cls: 'ready'},
      'sold': {label: '✅ Vendido', cls: 'sold'}
    };

    return `
    <div class="car">
      <div class="car-head ${isOpen?'is-open':''}" onclick="toggleCar('${car.id}')">
        <div class="car-title">
          <span class="name">${escapeHtml(car.name)}</span>
          <span class="badge ${stageMap[stage].cls}">${stageMap[stage].label}</span>
          ${!car.sold ? `<span class="days-tag">${days} días transcurridos</span>` : ''}
        </div>
        <div class="car-nums">
          <div>Invertido: <strong>${fmt(invested)}</strong></div>
          ${car.sold ? `<div class="profit ${profit>=0?'pos':'neg'}">Ganancia: ${fmt(profit)}</div>` : ''}
        </div>
        <span class="arrow-icon">▼</span>
      </div>

      <div class="car-body ${isOpen?'open':''}">
        <div class="stage-selector">
          <label>Cambiar Etapa Actual:</label>
          <select onchange="updateStage('${car.id}', this.value)">
            <option value="transit" ${stage==='transit'?'selected':''}>🚢 En Tránsito</option>
            <option value="repair" ${stage==='repair'?'selected':''}>🛠️ En Taller</option>
            <option value="pnc" ${stage==='pnc'?'selected':''}>📋 Experticia PNC</option>
            <option value="paperwork" ${stage==='paperwork'?'selected':''}>📄 En Placas / Sertracen</option>
            <option value="ready" ${stage==='ready'?'selected':''}>✨ Listo para Venta</option>
          </select>
        </div>

        <div class="row"><span class="l">Fecha de Compra</span><span class="r">${car.purchaseDate||'—'}</span></div>
        <div class="row"><span class="l">Precio de Compra</span><span class="r">${fmt(car.purchasePrice)}</span></div>
        <div class="row"><span class="l">Gastos Adicionales</span><span class="r">${fmt(carExpensesTotal(car))}</span></div>

        <div style="margin-top:16px;font-weight:600;font-size:13px;color:var(--text-secondary);">Detalle de Gastos:</div>
        <div class="expenses-list">
          ${(car.expenses||[]).map(e=>`
            <div class="expense-row">
              <span>${escapeHtml(e.desc)}</span>
              <span class="amt">${fmt(e.amount)}</span>
            </div>
          `).join('') || '<div style="font-size:12px;color:var(--text-muted);">Sin gastos cargados aún.</div>'}
        </div>
      </div>
    </div>
    `;
  }).join('');
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function toggleCar(id){ 
  openCarId = openCarId === id ? null : id; 
  render(); 
}

function updateStage(id, newStage){
  const car = cars.find(c=>c.id===id);
  car.stage = newStage;
  saveCar(car);
}

// Filtros y Eventos
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.getAttribute('data-filter');
    render();
  });
});

document.getElementById('search-input').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  render();
});

document.getElementById('btn-sync').onclick = loadFromSheet;
document.getElementById('btn-add-car').onclick = () => document.getElementById('modal-overlay').classList.add('open');
document.getElementById('btn-cancel').onclick = () => document.getElementById('modal-overlay').classList.remove('open');

document.getElementById('btn-save-car').onclick = () => {
  const name = document.getElementById('new-name').value.trim();
  const price = parseFloat(document.getElementById('new-price').value);
  const date = document.getElementById('new-date').value;

  if(!name || isNaN(price)){ alert('Completa nombre y precio válidos'); return; }

  const newCar = {
    id: 'c' + Date.now(),
    name, purchasePrice: price, purchaseDate: date,
    stage: 'repair', sold: false, expenses: []
  };

  cars.push(newCar);
  openCarId = newCar.id;
  saveCar(newCar);
  document.getElementById('modal-overlay').classList.remove('open');
};

loadFromSheet();
</script>
</body>
</html>
