<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de carros</title>
  <style>
    :root {
      --bg-primary: #0f1117;
      --card-bg: #181a20;
      --card-inner: #21242d;
      --text-main: #ffffff;
      --text-secondary: #9ca3af;
      --primary-yellow: #eab308;
      --primary-yellow-hover: #ca8a04;
      --green-profit: #22c55e;
      --green-bg: rgba(34, 197, 94, 0.15);
      --border: #2e323e;
      --danger-bg: rgba(239, 68, 68, 0.2);
      --danger-color: #ef4444;
      --danger-border: rgba(239, 68, 68, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); padding: 30px 20px; max-width: 900px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: var(--text-secondary); }

    .header-actions { display: flex; gap: 10px; align-items: center; }
    
    .status-container { display: flex; align-items: center; gap: 8px; }
    .status { font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 4px; }
    .status.info { color: var(--primary-yellow); }
    .status.success { color: var(--green-profit); background: var(--green-bg); }
    .status.error { color: var(--danger-color); background: var(--danger-bg); }

    /* Spinner / Circulito de carga */
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid var(--border);
      border-top: 2px solid var(--primary-yellow);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    .spinner.show { display: inline-block; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
    @media (max-width: 640px) { .metrics-grid { grid-template-columns: repeat(2, 1fr); } }
    
    .metric { background: var(--card-bg); padding: 16px; border-radius: 10px; border: 1px solid var(--border); }
    .metric .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); margin-bottom: 8px; font-weight: 600; }
    .metric .value { font-size: 22px; font-weight: 700; }
    .metric .value.pos { color: var(--green-profit); }
    .metric .value.neg { color: var(--danger-color); }

    .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .tabs { display: flex; gap: 6px; background: var(--card-bg); padding: 4px; border-radius: 8px; border: 1px solid var(--border); }
    .tab-btn { border: none; background: none; padding: 6px 14px; font-size: 12px; font-weight: 600; border-radius: 6px; cursor: pointer; color: var(--text-secondary); }
    .tab-btn.active { background: var(--primary-yellow); color: #000; }

    .btn { background: var(--primary-yellow); color: #000; border: none; padding: 8px 16px; font-size: 13px; font-weight: 700; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .btn:hover { background: var(--primary-yellow-hover); }
    .btn.secondary { background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border); }
    .btn.secondary:hover { background: var(--card-inner); }
    .btn.small { padding: 5px 10px; font-size: 12px; }
    .btn.danger-ghost { background: transparent; color: var(--danger-color); border: 1px solid var(--danger-border); }
    .btn.danger-ghost:hover { background: var(--danger-bg); }

    .car { background: var(--card-bg); border-radius: 10px; border: 1px solid var(--border); margin-bottom: 14px; overflow: hidden; }
    .car-head { padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
    .car-head:hover { background-color: rgba(255,255,255,0.02); }
    .car-title { display: flex; align-items: center; gap: 10px; }
    .car-title .name { font-weight: 700; font-size: 16px; }
    
    .badge { font-size: 10px; padding: 3px 8px; border-radius: 12px; font-weight: 700; text-transform: uppercase; }
    .badge.repair { background: rgba(234, 179, 8, 0.2); color: var(--primary-yellow); border: 1px solid rgba(234, 179, 8, 0.4); }
    .badge.sold { background: var(--green-bg); color: var(--green-profit); border: 1px solid rgba(34, 197, 94, 0.4); }
    .days-tag { font-size: 11px; color: var(--text-secondary); background: var(--card-inner); padding: 3px 8px; border-radius: 4px; }

    .car-nums { font-size: 13px; text-align: right; color: var(--text-secondary); }
    .car-nums strong { color: var(--text-main); }
    .car-nums .profit { font-weight: 700; font-size: 13px; margin-top: 2px; }
    .car-nums .profit.pos { color: var(--green-profit); }

    .arrow-icon { margin-left: 12px; font-size: 10px; color: var(--text-secondary); transition: transform 0.2s; }
    .is-open .arrow-icon { transform: rotate(180deg); }

    .car-body { padding: 18px; border-top: 1px solid var(--border); display: none; background: #13151b; }
    .car-body.open { display: block; }
    .row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px dashed var(--border); }
    .row .l { color: var(--text-secondary); }
    .row .r { font-weight: 600; }

    .expenses-header { display: flex; align-items: center; justify-content: space-between; margin: 16px 0 8px 0; }
    .expenses-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .expense-row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; background: var(--card-bg); border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; }
    .expense-row .amt { font-weight: 700; color: var(--primary-yellow); margin-right: 8px; }
    
    .expense-checkbox { cursor: pointer; width: 16px; height: 16px; accent-color: var(--primary-yellow); }

    .btn-delete-selected {
      background: var(--danger-bg);
      color: var(--danger-color);
      border: 1px solid var(--danger-border);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
    }
    .btn-delete-selected:hover { background: rgba(239, 68, 68, 0.4); }

    .multi-expenses-container { background: var(--card-bg); border: 1px solid var(--border); padding: 14px; border-radius: 8px; margin-bottom: 16px; }
    .expense-input-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .expense-input-row input { flex: 1; padding: 8px 12px; font-size: 13px; background: var(--card-inner); border: 1px solid var(--border); color: #fff; border-radius: 6px; }
    .expense-input-row input:focus { outline: 1px solid var(--primary-yellow); }

    .actions-row { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }

    /* Modales */
    .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.7); backdrop-filter: blur(3px); display: none; justify-content: center; align-items: center; z-index: 100; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 24px; width: 100%; max-width: 420px; color: white; }
    .modal h2 { font-size: 18px; margin-bottom: 16px; font-weight: 700; }
    .modal input { width: 100%; padding: 10px; margin-bottom: 12px; background: var(--card-inner); border: 1px solid var(--border); color: white; border-radius: 6px; font-size: 13px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }

    .empty { text-align: center; padding: 40px; color: var(--text-secondary); font-size: 14px; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Control de carros</h1>
      <div class="subtitle">Importación, Reparación y Venta</div>
    </div>
    <div class="header-actions">
      <div class="status-container">
        <div id="spinner" class="spinner"></div>
        <span id="status" class="status"></span>
      </div>
      <button class="btn" id="btn-add-car">+ Agregar carro</button>
      <button class="btn secondary" id="btn-sync">🔄 Sincronizar</button>
    </div>
  </header>

  <div id="metrics" class="metrics-grid"></div>

  <div class="controls">
    <div class="tabs">
      <button class="tab-btn active" data-filter="all">Todos</button>
      <button class="tab-btn" data-filter="active">En reparación</button>
      <button class="tab-btn" data-filter="sold">Vendidos</button>
    </div>
  </div>

  <div id="car-list"></div>

  <!-- Modal Agregar Carro -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h2>Agregar Nuevo Vehículo</h2>
      <input type="text" id="new-name" placeholder="Nombre / Modelo (ej: Nissan Rogue 2023)">
      <input type="number" id="new-price" placeholder="Precio de compra ($)" step="0.01">
      <input type="date" id="new-date">
      <div class="modal-actions">
        <button class="btn secondary" id="btn-cancel">Cancelar</button>
        <button class="btn" id="btn-save-car">Guardar Vehículo</button>
      </div>
    </div>
  </div>

  <!-- Modal Marcar Vendido -->
  <div class="modal-overlay" id="modal-sell">
    <div class="modal">
      <h2>Marcar Vehículo como Vendido</h2>
      <input type="number" id="sell-price" placeholder="Precio de venta final ($)" step="0.01">
      <div class="modal-actions">
        <button class="btn secondary" id="btn-cancel-sell">Cancelar</button>
        <button class="btn" id="btn-confirm-sell">Confirmar Venta</button>
      </div>
    </div>
  </div>

<script>
const GOOGLE_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw1b7dGmQh2DO0rs8pBH30xZbktf9MzqkvhSWHCuJo65x7FOOE63eFqY0YoeT2S7gLW4A/exec';

let cars = [];
let openCarId = null;
let currentFilter = 'all';
let carToSellId = null;

function showStatus(msg, type = 'info', showSpinner = false){
  const el = document.getElementById('status');
  const spinner = document.getElementById('spinner');
  
  el.textContent = msg;
  el.className = 'status ' + type;

  if(showSpinner){
    spinner.classList.add('show');
  } else {
    spinner.classList.remove('show');
  }
}

function fmt(n){ return '$' + (Number(n)||0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }

function calcDays(startDateStr){
  if(!startDateStr) return 0;
  const start = new Date(startDateStr);
  const now = new Date();
  return Math.ceil(Math.abs(now - start) / (1000 * 60 * 60 * 24)); 
}

// Envío a Google Apps Script con delay y circulito de carga
async function callGoogleAppsScript(action, data){
  showStatus('Guardando...', 'info', true);
  try{
    const response = await fetch(GOOGLE_APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({action, data})
    });
    const result = await response.json();
    if(result.success){
      showStatus('Guardado en la nube', 'success', false);
      setTimeout(()=> showStatus(''), 2000);
      return result;
    }
  }catch(e){
    showStatus('Error al guardar', 'error', false);
  }
}

async function loadFromSheet(){
  showStatus('Cargando...', 'info', true);
  const result = await callGoogleAppsScript('getCars', {});
  if(result && result.cars){
    cars = result.cars.map(c => {
      if(c.expenses){
        c.expenses = c.expenses.map(e => ({
          id: e.id || 'e_' + Math.random().toString(36).substr(2, 9),
          desc: e.desc,
          amount: e.amount
        }));
      }
      return c;
    });
    render();
    showStatus('', '', false);
  }
}

function carExpensesTotal(car){
  return (car.expenses||[]).reduce((s,e)=>s+Number(e.amount||0),0);
}

function carInvested(car){
  return Number(car.purchasePrice||0) + carExpensesTotal(car);
}

function carProfit(car){
  if(!car.sold) return null;
  return Number(car.salePrice||0) - carInvested(car);
}

function renderExpensesList(car){
  if(!car.expenses || car.expenses.length === 0){
    return '<div style="font-size:12px;color:var(--text-secondary);">Sin gastos cargados aún.</div>';
  }

  const itemsHtml = car.expenses.map((e) => `
    <div class="expense-row">
      <div style="display:flex; align-items:center; gap:10px;">
        <input type="checkbox" class="expense-checkbox exp-check-${car.id}" value="${e.id}">
        <span>${escapeHtml(e.desc)}</span>
      </div>
      <span class="amt">${fmt(e.amount)}</span>
    </div>
  `).join('');

  const headerHtml = `
    <div class="expenses-header">
      <label style="font-size:12px; cursor:pointer; color:var(--text-secondary); display:flex; align-items:center; gap:6px;">
        <input type="checkbox" class="expense-checkbox" onchange="toggleSelectAllExpenses('${car.id}', this.checked)"> Seleccionar todos
      </label>
      <button class="btn-delete-selected" onclick="deleteSelectedExpenses('${car.id}')">🗑️ Eliminar seleccionados</button>
    </div>
  `;

  return headerHtml + itemsHtml;
}

function updateSingleCarUI(carId){
  const car = cars.find(c => c.id === carId);
  if(!car) return;

  const cardNode = document.getElementById(`car-${carId}`);
  if(cardNode){
    const investedNode = cardNode.querySelector('.car-invested-val');
    if(investedNode) investedNode.textContent = fmt(carInvested(car));

    const expTotalNode = cardNode.querySelector('.car-exp-total-val');
    if(expTotalNode) expTotalNode.textContent = fmt(carExpensesTotal(car));

    const listNode = cardNode.querySelector('.expenses-list');
    if(listNode){
      listNode.innerHTML = renderExpensesList(car);
    }
  }

  renderMetrics();
}

function renderMetrics(){
  const activos = cars.filter(c=>!c.sold);
  const vendidos = cars.filter(c=>c.sold);
  
  const totalInvertidoActivo = activos.reduce((s,c)=>s+carInvested(c),0);
  const gananciaTotal = vendidos.reduce((s,c)=>s+carProfit(c),0);

  const el = document.getElementById('metrics');
  el.innerHTML = `
    <div class="metric">
      <div class="label">Invertido (En Proceso)</div>
      <div class="value">${fmt(totalInvertidoActivo)}</div>
    </div>
    <div class="metric">
      <div class="label">Carros activos</div>
      <div class="value">${activos.length}</div>
    </div>
    <div class="metric">
      <div class="label">Carros vendidos</div>
      <div class="value">${vendidos.length}</div>
    </div>
    <div class="metric">
      <div class="label">Ganancia total</div>
      <div class="value ${gananciaTotal>=0?'pos':'neg'}">${fmt(gananciaTotal)}</div>
    </div>
  `;
}

function render(){
  renderMetrics();
  const list = document.getElementById('car-list');

  let filtered = cars.filter(c => {
    if(currentFilter === 'active') return !c.sold;
    if(currentFilter === 'sold') return c.sold;
    return true;
  });

  if(filtered.length === 0){
    list.innerHTML = `<div class="empty">No hay vehículos registrados en este estado.</div>`;
    return;
  }

  list.innerHTML = filtered.map(car => {
    const days = calcDays(car.purchaseDate);
    const invested = carInvested(car);
    const profit = carProfit(car);
    const isOpen = openCarId === car.id;

    return `
    <div class="car" id="car-${car.id}">
      <div class="car-head ${isOpen?'is-open':''}" onclick="toggleCar('${car.id}')">
        <div class="car-title">
          <span class="name">${escapeHtml(car.name)}</span>
          <span class="badge ${car.sold?'sold':'repair'}">${car.sold?'VENDIDO':'EN REPARACIÓN'}</span>
          ${!car.sold ? `<span class="days-tag">${days} días transcurridos</span>` : ''}
        </div>
        <div class="car-nums">
          <div>Invertido: <strong class="car-invested-val">${fmt(invested)}</strong></div>
          ${car.sold ? `<div class="profit ${profit>=0?'pos':'neg'}">Ganancia: ${fmt(profit)}</div>` : ''}
        </div>
        <span class="arrow-icon">▼</span>
      </div>

      <div class="car-body ${isOpen?'open':''}">
        <div class="row"><span class="l">Fecha de Compra</span><span class="r">${car.purchaseDate||'—'}</span></div>
        <div class="row"><span class="l">Precio de Compra</span><span class="r">${fmt(car.purchasePrice)}</span></div>
        <div class="row"><span class="l">Gastos Adicionales</span><span class="r car-exp-total-val">${fmt(carExpensesTotal(car))}</span></div>

        <div style="margin-top:16px;font-weight:600;font-size:13px;color:var(--text-secondary);">Detalle de Gastos:</div>
        <div class="expenses-list">
          ${renderExpensesList(car)}
        </div>

        <div class="multi-expenses-container">
          <div style="font-size:13px;font-weight:600;margin-bottom:8px;color:var(--text-secondary);">Cargar Gastos:</div>
          <div id="expenses-inputs-${car.id}">
            <div class="expense-input-row">
              <input type="text" placeholder="Descripción" class="exp-desc">
              <input type="number" placeholder="Monto" class="exp-amt" step="0.01">
            </div>
          </div>
          <div style="display:flex;gap:8px;margin-top:8px;">
            <button class="btn secondary small" onclick="addExpenseRow('${car.id}')">+ Otra fila</button>
            <button class="btn small" onclick="saveExpenses('${car.id}')">Guardar Gastos</button>
          </div>
        </div>

        <div class="actions-row">
          <button class="btn danger-ghost small" onclick="deleteCar('${car.id}')">Eliminar Carro</button>
          ${!car.sold ? `
            <button class="btn small" onclick="openSellModal('${car.id}')">Marcar como Vendido</button>
          ` : `
            <div style="font-size:13px;color:var(--text-secondary);">Vendido por: <strong style="color:#fff">${fmt(car.salePrice)}</strong></div>
          `}
        </div>

      </div>
    </div>
    `;
  }).join('');
}

function toggleSelectAllExpenses(carId, isChecked){
  const checkboxes = document.querySelectorAll(`.exp-check-${carId}`);
  checkboxes.forEach(cb => cb.checked = isChecked);
}

async function deleteSelectedExpenses(carId){
  const car = cars.find(c => c.id === carId);
  if(!car || !car.expenses) return;

  const checkboxes = document.querySelectorAll(`.exp-check-${carId}:checked`);
  const selectedIds = Array.from(checkboxes).map(cb => cb.value);

  if(selectedIds.length === 0){
    alert('Selecciona al menos un gasto para eliminar.');
    return;
  }

  if(!confirm(`¿Deseas eliminar los ${selectedIds.length} gastos seleccionados?`)) return;

  car.expenses = car.expenses.filter(e => !selectedIds.includes(e.id));

  updateSingleCarUI(carId);

  await callGoogleAppsScript('saveCar', { car });
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function toggleCar(id){ 
  openCarId = openCarId === id ? null : id; 
  render(); 
}

function addExpenseRow(carId){
  const container = document.getElementById(`expenses-inputs-${carId}`);
  const row = document.createElement('div');
  row.className = 'expense-input-row';
  row.innerHTML = `
    <input type="text" placeholder="Descripción" class="exp-desc">
    <input type="number" placeholder="Monto" class="exp-amt" step="0.01">
  `;
  container.appendChild(row);
}

// AL GUARDAR GASTOS: SE LIMPIAN LAS CAJAS DE TEXTO PARA EVITAR DUPLICADOS
async function saveExpenses(carId){
  const car = cars.find(c=>c.id===carId);
  const container = document.getElementById(`expenses-inputs-${carId}`);
  const descs = container.querySelectorAll('.exp-desc');
  const amts = container.querySelectorAll('.exp-amt');

  let added = false;
  descs.forEach((d, i)=>{
    const desc = d.value.trim();
    const amount = parseFloat(amts[i].value);
    if(desc && !isNaN(amount) && amount > 0){
      car.expenses = car.expenses || [];
      car.expenses.push({
        id: 'e_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        desc, 
        amount
      });
      added = true;
    }
  });

  if(added){
    // 1. Limpiar inmediatamente el formulario de ingreso
    container.innerHTML = `
      <div class="expense-input-row">
        <input type="text" placeholder="Descripción" class="exp-desc">
        <input type="number" placeholder="Monto" class="exp-amt" step="0.01">
      </div>`;

    // 2. Actualizar la lista en pantalla
    updateSingleCarUI(carId);

    // 3. Enviar a la nube mostrando el spinner de carga
    await callGoogleAppsScript('saveCar', { car });
  }else{
    alert('Ingresa al menos una descripción y monto válidos.');
  }
}

async function deleteCar(id){
  if(!confirm('¿Seguro que deseas eliminar este vehículo?')) return;
  cars = cars.filter(c => c.id !== id);
  render();
  callGoogleAppsScript('deleteCar', {id});
}

function openSellModal(id){
  carToSellId = id;
  document.getElementById('sell-price').value = '';
  document.getElementById('modal-sell').classList.add('open');
}

document.getElementById('btn-cancel-sell').onclick = () => document.getElementById('modal-sell').classList.remove('open');

document.getElementById('btn-confirm-sell').onclick = async () => {
  const price = parseFloat(document.getElementById('sell-price').value);
  if(isNaN(price) || price <= 0){ alert('Ingresa un precio válido.'); return; }
  
  const car = cars.find(c=>c.id===carToSellId);
  car.sold = true;
  car.salePrice = price;
  
  document.getElementById('modal-sell').classList.remove('open');
  render();
  await callGoogleAppsScript('saveCar', { car });
};

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.getAttribute('data-filter');
    render();
  });
});

document.getElementById('btn-sync').onclick = loadFromSheet;
document.getElementById('btn-add-car').onclick = () => document.getElementById('modal-overlay').classList.add('open');
document.getElementById('btn-cancel').onclick = () => document.getElementById('modal-overlay').classList.remove('open');

document.getElementById('btn-save-car').onclick = async () => {
  const name = document.getElementById('new-name').value.trim();
  const price = parseFloat(document.getElementById('new-price').value);
  const date = document.getElementById('new-date').value;

  if(!name || isNaN(price)){ alert('Completa nombre y precio válidos'); return; }

  const newCar = {
    id: 'c' + Date.now(),
    name, purchasePrice: price, purchaseDate: date,
    sold: false, expenses: []
  };

  cars.push(newCar);
  openCarId = newCar.id;
  render();
  await callGoogleAppsScript('saveCar', { car: newCar });
  document.getElementById('modal-overlay').classList.remove('open');
};

loadFromSheet();
</script>
